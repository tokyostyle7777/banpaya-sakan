<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="波情報">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">

<title>波情報 | 和田・白渚</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#dfe6ee;color:#222;font-family:-apple-system,'Hiragino Sans',sans-serif;max-width:480px;margin:0 auto;min-height:100vh}

/* ヘッダー */
.hdr{background:linear-gradient(180deg,#6589bd,#5b8ab8);padding:10px 10px 8px;color:#fff}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hdr-title{font-size:18px;font-weight:700;letter-spacing:1px}
.hdr-refresh{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 4px}
.hdr-tabs{display:flex;gap:5px}
.htab{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:600;color:rgba(255,255,255,0.85);cursor:pointer;border-radius:9px;background:rgba(255,255,255,0.16)}
.htab.active{background:#fff;color:#3d6ca5;font-weight:800}

/* タブコンテンツ */
.tab-body{background:transparent;padding-bottom:14px}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ===== 波情報タブ ===== */
/* メインビジュアル */
.wave-visual{position:relative;border-radius:14px;margin:10px 8px 0;box-shadow:0 1px 4px rgba(30,60,100,0.12);background:linear-gradient(180deg,#87ceeb 0%,#87ceeb 45%,#5b9bd5 45%,#4a8cc4 60%,#d4a96a 60%,#c9975a 68%,#b8864a 68%,#7a6040 100%);height:210px;overflow:hidden}
.wave-visual .wv-top{position:absolute;top:10px;right:12px;text-align:right;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5);font-size:12px;line-height:1.6}
.wave-visual .wv-size-block{position:absolute;top:12px;left:14px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.6)}
.wv-tri{font-size:28px;color:#5ee8ff;line-height:1}
.wv-num{font-size:56px;font-weight:700;color:#5ee8ff;line-height:1;margin-left:2px}
.wv-jpname{font-size:15px;font-weight:600;color:#fff;margin-top:2px}
/* 風向矢印（大） */
.wind-arrow-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-40%);pointer-events:none}
.wind-arr-svg{width:140px;height:60px;opacity:0.85}
.side-label{position:absolute;top:55%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:rgba(255,255,255,0.9);text-shadow:0 1px 6px rgba(0,0,0,0.5);letter-spacing:2px}
/* 砂浜の人 */
.surfer-wrap{position:absolute;bottom:42%;left:14px}
.surfer-svg{width:50px;height:90px;opacity:0.9}
/* ビーチ下部 */
.wave-info-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.25);display:flex;align-items:center;gap:12px;padding:5px 12px;font-size:12px;color:#fff}

/* データカード */
.data-cards{display:flex;background:#fff;border-radius:14px;margin:10px 8px 0;box-shadow:0 1px 4px rgba(30,60,100,0.10);overflow:hidden}
.dc{flex:1;display:flex;align-items:center;gap:6px;padding:10px 12px;border-right:1px solid #e0e0e0}
.dc:last-child{border-right:none}
.dc-icon{font-size:22px}
.dc-label{font-size:10px;color:#888;display:block}
.dc-val{font-size:15px;font-weight:700;color:#5b8ab8}

/* コンディション */
.cond-section{padding:14px;background:#fff;border-radius:14px;margin:10px 8px 0;box-shadow:0 1px 4px rgba(30,60,100,0.10)}
.cond-title{font-size:15px;font-weight:700;color:#5b8ab8;margin-bottom:8px}
.cond-row{display:flex;padding:4px 0;border-bottom:1px dotted #eee;font-size:13px}
.cond-row:last-child{border-bottom:none}
.cond-key{color:#5b8ab8;font-weight:600;width:50px;flex-shrink:0}
.cond-val{color:#444;flex:1}

/* カメラリンク */
.cam-section{padding:14px;background:#fff;border-radius:14px;margin:10px 8px 0;box-shadow:0 1px 4px rgba(30,60,100,0.10)}
.cam-title{font-size:14px;font-weight:700;color:#5b8ab8;margin-bottom:8px}
.cam-links{display:flex;flex-direction:column;gap:6px}
.cam-link{display:flex;align-items:center;gap:8px;background:#f0f6ff;border-radius:8px;padding:8px 12px;text-decoration:none;color:#333;font-size:13px}
.cam-link-icon{font-size:18px}

/* ===== タイドタブ ===== */
.tide-header{background:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-radius:14px 14px 0 0;margin:10px 8px 0}
.tide-date{font-size:15px;font-weight:700;color:#5b8ab8}
.tide-type-badge{background:#5b8ab8;color:#fff;font-size:12px;padding:3px 8px;border-radius:12px}
.tide-sun{font-size:12px;color:#888;display:flex;gap:12px}
.tide-graph-wrap{background:#eef4fb;padding:12px 10px;position:relative;margin:0 8px}
canvas#tideChart{display:block}
.tide-extremes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:12px;background:#fff;margin:0 8px}
.te-item{text-align:center;background:#f0f6ff;border-radius:8px;padding:6px 4px}
.te-type{font-size:10px;color:#888;margin-bottom:2px}
.te-time{font-size:14px;font-weight:700;color:#333}
.te-cm{font-size:12px;color:#5b8ab8;font-weight:600}

/* ===== 予報タブ ===== */
.fc-toggle{display:flex;margin:12px 8px 0;border:2px solid #5b8ab8;border-radius:10px;overflow:hidden;background:#fff}
.fc-toggle-btn{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#5b8ab8}
.fc-toggle-btn.active{background:#5b8ab8;color:#fff}
.fc-day-header{background:#fff;padding:11px 14px;font-size:14px;font-weight:800;color:#2f6db5;border-radius:14px 14px 0 0;margin:12px 8px 0;border-bottom:1px solid #e8eef6}
.fc-table-wrap{overflow-x:auto;border-bottom:2px solid #5b8ab8}
.fc-table{border-collapse:collapse;min-width:100%;font-size:12px;background:#fff}
.fc-table th{background:#dce8f4;padding:5px 8px;text-align:center;white-space:nowrap;border-right:1px solid #ccc;color:#555;font-weight:600;font-size:11px;position:sticky;left:0;z-index:1}
.fc-table td{padding:7px 10px;text-align:center;border-right:1px solid #eee;border-bottom:1px solid #eee;white-space:nowrap}
.fc-table tr:nth-child(even) td{background:#f8fbff}
.fc-now td{background:#fff3cd!important}
.fc-wind-arrow{display:inline-block;font-size:16px}
/* BCM風 横スクロール予報 */
.bcm-wrap{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border-radius:0 0 14px 14px;margin:0 8px;box-shadow:0 1px 4px rgba(30,60,100,0.10)}
.bcm-labels{position:sticky;left:0;background:#f8f9fa;z-index:2;flex-shrink:0;width:38px;border-right:1px solid #d8dde3;font-size:10px;color:#667;font-weight:700}
.bcm-col{flex-shrink:0;width:62px;text-align:center;border-right:1px solid #f0f2f5}
.bcm-col.now{background:#eaf3ff}
.bcm-cell{display:flex;align-items:center;justify-content:center;border-bottom:1px solid #f5f6f8}
.bcm-bar-area{position:relative;background:linear-gradient(180deg,#ddeafe 0%,#cfe2fb 100%)}
.bcm-bar{position:absolute;bottom:0;left:0;right:0;background:#2f6db5}
.wt-badge{font-size:9px;font-weight:800;color:#fff;border-radius:3px;padding:2px 3px;line-height:1.2;display:inline-block}
.fc-wh{font-weight:700;color:#5b8ab8}

/* カメラセクション */
.cam-section{padding:12px 14px;border-bottom:1px solid #e8e8e8}
.cam-title{font-size:14px;font-weight:700;color:#5b8ab8;margin-bottom:8px}
.cam-area-header{font-size:13px;font-weight:700;color:#fff;background:#5b8ab8;border-radius:6px;padding:4px 10px;margin-bottom:6px}
.cam-links{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.cam-link{display:flex;align-items:center;gap:10px;background:#f0f6ff;border-radius:8px;padding:9px 12px;text-decoration:none;color:#333;font-size:13px;font-weight:600}
.cam-link-icon{font-size:20px;flex-shrink:0}
.cam-sub{font-size:11px;color:#888;font-weight:400;display:block;margin-top:1px}

/* ローディング */
.loading{text-align:center;padding:60px 20px;color:#5b8ab8}
.spin{font-size:36px;animation:spin 1.5s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:#ffeaea;border-radius:8px;padding:12px;margin:12px;font-size:13px;color:#c00}

/* ===== 一覧タブ ===== */
.spot-area-hdr{background:transparent;padding:12px 16px 5px;font-size:13px;font-weight:800;color:#41699e;letter-spacing:1px}
.spot-card{display:flex;align-items:center;padding:11px 12px;cursor:pointer;background:#fff;gap:11px;border-radius:12px;margin:0 8px 8px;box-shadow:0 1px 3px rgba(30,60,100,0.09);-webkit-tap-highlight-color:rgba(91,138,184,0.1);border-left:5px solid #ccc}
.spot-card.current{background:#eef5ff;outline:2px solid #8fb4dd}
.spot-visual{width:52px;height:52px;border-radius:26px;flex-shrink:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;font-weight:900}
.spot-visual .wv-arrow{font-size:22px;line-height:1}
.spot-visual .wv-label{font-size:8px;letter-spacing:0.5px;margin-top:1px}
.spot-info{flex:1;min-width:0}
.spot-name{font-size:13px;font-weight:700;color:#333}
.spot-jp{font-size:21px;color:#274b6e;font-weight:900;margin-top:2px}
.spot-jp .spot-jp-sub{font-size:12px;color:#888;font-weight:500;margin-left:5px}
.spot-wind-row{font-size:12px;color:#556;margin-top:3px;font-weight:600}
.spot-score-wrap{flex-shrink:0;text-align:right;min-width:60px}
.spot-stars{font-size:15px;line-height:1.3;letter-spacing:1px}
.spot-wh-small{font-size:11px;color:#5b8ab8;font-weight:600;margin-top:2px}

/* ボトムナビ */
.bnav{height:60px} /* スペーサー */
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div style="font-size:13px;color:rgba(255,255,255,0.8)" id="checkTime">読み込み中...</div>
    <div class="hdr-title" id="spotTitle" onclick="openSpotMenu()" style="cursor:pointer;user-select:none">和田・白渚 ▾</div>
    <button class="hdr-refresh" onclick="loadAll()" title="更新">↻</button>
  </div>
  <div class="hdr-tabs">
    <div class="htab active" onclick="showTab('list')">一覧</div>
    <div class="htab" onclick="showTab('wave')">波情報</div>
    <div class="htab" onclick="showTab('tide')">タイド</div>
    <div class="htab" onclick="showTab('weather')">気象</div>
  </div>
</div>

<!-- 一覧タブ -->
<div class="tab-pane active" id="pane-list">
  <div id="listContent"><div class="loading"><div class="spin">🌊</div><br>全スポット取得中...</div></div>
</div>

<!-- 波情報タブ -->
<div class="tab-pane" id="pane-wave">
  <div id="waveContent"><div class="loading"><div class="spin">🌊</div><br>データ取得中...</div></div>
</div>

<!-- タイドタブ（タイドグラフ＋時間予報 統合） -->
<div class="tab-pane" id="pane-tide">
  <div id="tideContent"><div class="loading"><div class="spin">🌊</div><br>潮汐計算中...</div></div>
  <div class="fc-toggle" style="margin-top:0;border-top:2px solid #5b8ab8">
    <div class="fc-toggle-btn active" id="btn1h" onclick="setFcInterval(1)">1時間表示</div>
    <div class="fc-toggle-btn" id="btn3h" onclick="setFcInterval(3)">3時間表示</div>
  </div>
  <div id="forecastContent"><div class="loading"><div class="spin">📊</div><br>予報取得中...</div></div>
</div>

<!-- 気象タブ -->
<div class="tab-pane" id="pane-weather">
  <div id="weatherContent"><div class="loading"><div class="spin">🌀</div><br>気象データ取得中...</div></div>
</div>

<div class="bnav"></div>

<!-- スポット選択モーダル -->
<div id="spotMenu" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);z-index:2000" onclick="if(event.target===this)closeSpotMenu()">
  <div style="background:#fff;margin:50px auto 20px;max-width:480px;border-radius:14px;overflow:hidden;max-height:80vh;display:flex;flex-direction:column">
    <div style="background:#5b8ab8;padding:14px 16px;color:#fff;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
      📍 スポット選択
      <button onclick="closeSpotMenu()" style="background:none;border:none;color:#fff;font-size:26px;cursor:pointer;line-height:1">×</button>
    </div>
    <div id="spotList" style="overflow-y:auto;-webkit-overflow-scrolling:touch"></div>
  </div>
</div>

const DIR_LABELS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
const ARROW_CHARS = ['↑','↗','↗','→','→','↘','↘','↓','↓','↙','↙','←','←','↖','↖','↑'];
const dir = d => DIR_LABELS[Math.round(d/22.5)%16];
const arrChar = d => ARROW_CHARS[Math.round(d/22.5)%16];

function windType(windDeg, facing) {
  let diff = ((windDeg - facing) + 360) % 360;
  if (diff > 180) diff = 360 - diff;
  const cross = ((windDeg - facing + 360) % 360) < 180;
  if (diff <= 30)  return {label:'オンショア', short:'ON', cls:'on'};
  if (diff <= 70)  return {label: cross ? 'サイドオン' : 'サイドオン', short:'SIDE\nON', cls:'sideon'};
  if (diff <= 120) return {label: cross ? 'サイドオフ' : 'サイドオフ', short:'SIDE\nOFF', cls:'sideoff'};
  return {label:'オフショア', short:'OFF', cls:'off'};
}

function windStr(spd) {
  if (spd < 3)  return '';
  if (spd < 5)  return '（弱）';

}

function conditionText(wh, wp, wt) {
  const face = {
    wave: wt.cls==='off' && wp>8 ? 'クリーン' :

    swell: wp>10 ? 'まとまったうねり' : wp>8 ? 'ほぼまとまっている' : wp>6 ? 'ややまとまりがない状態' : 'まとまりがない状態',
    count: wh>1.2 ? 'セットが入る。波数はある' : wh>0.7 ? '波数はほどほど' : '波数は少ない',
    pos: '—'
  };

}

// ── うねり実効サイズ（うねり分離＋向き考慮） ──
// うねいの向きとビーチの向きが合うほどサイズが出る。風波は0.9掛けで合成。
function exposureFactor(swellDeg, facing) {
  const diff = Math.abs(((swellDeg - facing) + 540) % 360 - 180);
  return diff <= 45 ? 1.0 : diff <= 75 ? 0.85 : diff <= 105 ? 0.6 : 0.35;
}
// 実測較正：2024年 鹿島NOWPHAS 8,778時間 vs Open-Meteoの突合から導出（相関0.95）
// モデルは大波ほど控えめに出る（2.8m超で実際は1.23倍）→区分線形で補正
const CALIB = [[0.4,0.95],[0.85,0.99],[1.25,1.07],[1.75,1.13],[2.4,1.18],[3.2,1.23]];
function calibrateHs(m) {
  if (m <= CALIB[0][0]) return CALIB[0][1];
  for (let i = 1; i < CALIB.length; i++) {
    if (m <= CALIB[i][0]) {
      const [x0,y0] = CALIB[i-1], [x1,y1] = CALIB[i];
      return y0 + (y1 - y0) * (m - x0) / (x1 - x0);
    }
  }
  return CALIB[CALIB.length-1][1];
}
function effectiveFace(mc, facing) {
  const calib = calibrateHs(mc.wave_height ?? 0);
  const sw  = mc.swell_wave_height;
  if (sw === undefined || sw === null) return (mc.wave_height ?? 0) * calib * SURF_FACTOR;
  const wwh  = mc.wind_wave_height ?? 0;
  const sdir = mc.swell_wave_direction ?? mc.wave_direction ?? facing;
  const expo = exposureFactor(sdir, facing);
  return Math.sqrt((sw * expo) ** 2 + (wwh * 0.9) ** 2) * calib * SURF_FACTOR;
}

// ── BCM風サイズ表記（モモ〜コシ setハラ） ──
function jpOne(h) {
  if (h < 0.2)  return 'フラット';
  if (h < 0.35) return 'スネ';
  if (h < 0.5)  return 'ヒザ';
  if (h < 0.7)  return 'モモ';
  if (h < 0.9)  return 'コシ';
  if (h < 1.1)  return 'ハラ';
  if (h < 1.3)  return 'ムネ';
  if (h < 1.55) return 'カタ';
  if (h < 1.8)  return 'アタマ';
  if (h < 2.4)  return 'アタマ半';
  return 'ダブル';
}
function bcmSize(face) {
  const lo = jpOne(face * 0.75), hi = jpOne(face), set = jpOne(face * 1.35);
  const range = lo === hi ? hi : `${lo}〜${hi}`;
  return set !== hi ? `${range} <span style="font-size:0.62em;opacity:0.85">set${set}</span>` : range;
}

// ── 予報信頼度（3モデルの一致度） ──
function modelAgreement() {
  const h = DATA?.models?.hourly;
  if (!h) return null;
  const keys = Object.keys(h).filter(k => k.startsWith('wave_height_'));
  if (keys.length < 2) return null;
  const nowIdx = Math.max(0, h.time.findIndex(t => new Date(t) >= new Date()));
  let spreads = [], n = 0;
  for (let i = nowIdx; i < Math.min(nowIdx + 24, h.time.length); i++) {
    const vals = keys.map(k => h[k][i]).filter(v => v !== null && v !== undefined);
    if (vals.length < 2) continue;
    const mean = vals.reduce((a,b)=>a+b,0) / vals.length;
    if (mean < 0.05) continue;
    spreads.push((Math.max(...vals) - Math.min(...vals)) / mean);
    n++;
  }
  if (!n) return null;
  const avg = spreads.reduce((a,b)=>a+b,0) / n;
  if (avg < 0.18) return { mark:'◎', text:'3モデルほぼ一致・信頼度 高', color:'#00b359' };
  if (avg < 0.40) return { mark:'○', text:'モデル間に少し差・信頼度 中', color:'#5b8ab8' };
  return { mark:'△', text:'モデルの予想が割れている・参考程度', color:'#f5a623' };
}

// ── 本物の潮汐（気象庁・Macが同梱） ──
function tideStationFor(area) {
  return (area === '千葉南' || area === '千葉北') ? 'ZF' : 'MR';
}
function tideDay(area, d = new Date()) {
  if (!TIDE) return null;
  const st = TIDE.stations[tideStationFor(area)];
  if (!st) return null;
  const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return st.days[key] ? { name: st.name, ...st.days[key] } : null;
}
function tideNowCm(day, d = new Date()) {
  const h = d.getHours();
  const a = day.h[h], b = h < 23 ? day.h[h+1] : day.h[23];
  return Math.round(a + (b - a) * (d.getMinutes() / 60));
}
// 潮の状態：上げ◯分・下げ◯分（満干時刻から算出）
function tideState(day, d = new Date()) {
  const toMin = s => parseInt(s.slice(0,2)) * 60 + parseInt(s.slice(3,5));
  const nowM = d.getHours() * 60 + d.getMinutes();
  const evs = [...day.hi.map(e => ({ m: toMin(e[0]), type: 'hi' })),
               ...day.lo.map(e => ({ m: toMin(e[0]), type: 'lo' }))].sort((a,b) => a.m - b.m);
  if (!evs.length) return null;
  let prev = null, next = null;
  for (const e of evs) { if (e.m <= nowM) prev = e; else { next = e; break; } }
  if (!prev || !next) {
    // 日マタギは潮位トレンドで判定
    const cm = tideNowCm(day, d), cm1 = day.h[Math.min(d.getHours()+1, 23)];
    return { dir: cm1 >= cm ? '上げ' : '下げ', label: cm1 >= cm ? '上げ' : '下げ' };
  }
  const prog = Math.round(((nowM - prev.m) / (next.m - prev.m)) * 10);
  const dir = next.type === 'hi' ? '上げ' : '下げ';
  return { dir, label: `${dir}${Math.min(Math.max(prog,0),10)}分` };
}
// スポットの潮の癖との相性（tide_pref: 'low'=干潮〜中間が良い）
function tidePrefBonus(sp, day, d = new Date()) {
  if (!sp.tide_pref || !day) return 0;
  const min = Math.min(...day.h), max = Math.max(...day.h);
  if (max - min < 20) return 0;
  const pct = (tideNowCm(day, d) - min) / (max - min);
  if (sp.tide_pref === 'low')  return pct < 0.45 ? 6 : pct > 0.75 ? -4 : 0;
  if (sp.tide_pref === 'high') return pct > 0.55 ? 6 : pct < 0.25 ? -4 : 0;
  return 0;
}

// ── 潮汐サイン近似（和田浦基準） ──
// 参照: 2026/04/28 02:35 JST = 満潮 134cm
const TIDE_REF   = new Date('2026-04-28T02:35:00+09:00').getTime();
const TIDE_PERIOD = 12.42 * 3600 * 1000;
const TIDE_AMP   = 38;
const TIDE_MEAN  = 90;
function tideCm(d) {
  const dt = d.getTime() - TIDE_REF;
  return Math.round(TIDE_MEAN + TIDE_AMP * Math.cos(2 * Math.PI * dt / TIDE_PERIOD));
}

// 極値（干満潮）を検出
function getTideExtremes(baseDate, hours=48) {
  const pts = [];
  for (let m = 0; m <= hours*60; m += 10) {
    const t = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), 0, m);
    pts.push({t, cm: tideCm(t)});
  }
  const ex = [];
  for (let i = 1; i < pts.length-1; i++) {
    const p = pts[i-1].cm, c = pts[i].cm, n = pts[i+1].cm;
    if (c > p && c > n) ex.push({...pts[i], type:'満潮'});
    if (c < p && c < n) ex.push({...pts[i], type:'干潮'});
  }
  return ex;
}

// 月齢から潮の種類
function tideTypeName(date) {
  const ref = new Date('2000-01-06T18:14:00Z').getTime();
  const days = (date - ref) / 86400000;
  const phase = ((days % 29.53058867) + 29.53058867) % 29.53058867;
  if (phase < 1.5 || phase > 28 || (phase > 13.5 && phase < 16)) return '大潮';
  if ((phase >= 1.5 && phase < 4) || (phase >= 11 && phase < 13.5) || (phase >= 16 && phase < 18) || (phase >= 25 && phase < 28)) return '中潮';
  if ((phase >= 4 && phase < 7) || (phase >= 18 && phase < 21)) return '小潮';
  if ((phase >= 7 && phase < 8) || (phase >= 21 && phase < 22)) return '長潮';
  if ((phase >= 8 && phase < 9.5) || (phase >= 22 && phase < 24)) return '若潮';
  return '中潮';
}

// ── 波情報タブ描画 ──
function renderWave() {
  const mc = DATA.marine.current;
  const wc = DATA.weather.current;

  // ── 「今の波」はNOWPHAS実測優先・予報モデルはフォールバック ──
  // スポットのobs指定 → 優先観測点 → フォールバック順で探す
  const obsPriority = [SPOT.obs, '219', '222', '504'].filter(Boolean);
  const obs0 = obsPriority.reduce((found, code) =>
    found || OBS?.stations?.find(s => s.code === code), null);
  const useObs = !!obs0;

  let wh, wp, swH, swP, swD, swDirStr, wwH, obsLabel;
  if (useObs) {
    wh       = obs0.hs * SURF_FACTOR;                          // 実測Hs → フェイス換算（較正不要）
    wp       = obs0.period;
    swH      = obs0.swell_cm != null ? obs0.swell_cm / 100 : null;
    swP      = obs0.period;                                    // NOWPHASは全波周期で代用
    swDirStr = obs0.swell_dir ?? null;                         // "NE"など方位文字列
    swD      = null;
    wwH      = obs0.windwave_cm != null ? obs0.windwave_cm / 100 : null;
    obsLabel = `📡 実測（${obs0.name} ${OBS.obs_time ?? ''}・20分毎更新）`;
  } else {
    wh       = effectiveFace(mc, SPOT.facing);
    swH      = mc.swell_wave_height ?? null;
    swP      = mc.swell_wave_period ?? null;
    swD      = mc.swell_wave_direction ?? null;
    swDirStr = null;
    wwH      = mc.wind_wave_height ?? null;
    wp       = swP ?? mc.wave_period ?? 0;
    obsLabel = '⚠️ 予報モデル（実測データ取得失敗）';
  }
  const sst  = mc.sea_surface_temperature ?? null;
  const wspd = wc.wind_speed_10m ?? 0;
  const wdeg = wc.wind_direction_10m ?? 0;
  const temp = wc.temperature_2m ?? null;
  const wcode= wc.weather_code ?? 0;

  const wt  = windType(wdeg, SPOT.facing);
  const wn  = waveNum(wh);
  const jp  = bcmSize(wh);
  const cond= conditionText(wh, wp, wt);
  const wdir= dir(wdeg);
  const wstr= windStr(wspd);
  const agree = modelAgreement();
  const tDay  = tideDay(SPOT.area);
  const tSt   = tDay ? tideState(tDay) : null;
  const tBonus= tDay ? tidePrefBonus(SPOT, tDay) : 0;

  // 矢印の回転角度（上向き=0度が「北」なので、風向degをそのまま使用）
  const arrowDeg = wdeg;

  // ビジュアル背景色（サイド判定で変化）
  const arrowColor = wt.cls==='off' ? '#4aff84' : wt.cls==='sideoff' ? '#a4ff4a' : wt.cls==='sideon' ? '#ffd04a' : '#ff6b4a';

// ── 実測カード（NOWPHAS・国交省） ──
function renderObsCard() {
  if (!OBS?.stations?.length) return '';
  // エリアに合う観測点を優先表示
  const isBay = SPOT.area === '内房';
  const order = isBay ? ['217','221','222','504'] : ['222','504','217','221'];
  const sts = [...OBS.stations].sort((a,b) => order.indexOf(a.code) - order.indexOf(b.code)).slice(0,2);
  const rows = sts.map(s => {
    const swell = s.swell_cm !== null && s.swell_cm !== undefined ? `うねり${(s.swell_cm/100).toFixed(1)}m(${s.swell_dir||'—'})` : '';
    const fuha  = s.windwave_cm !== null && s.windwave_cm !== undefined ? `風波${(s.windwave_cm/100).toFixed(1)}m` : '';
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid #f0f0f0">
      <div>
        <div style="font-size:13px;font-weight:700;color:#333">${s.name} <span style="font-size:10px;font-weight:400;color:#888">${s.role}</span></div>
        <div style="font-size:11px;color:#888">${swell}${swell&&fuha?'・':''}${fuha}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:17px;font-weight:900;color:#1565c0">${s.hs.toFixed(2)}m</div>
        <div style="font-size:10px;color:#888">${s.period ? s.period.toFixed(1)+'秒' : ''} ${s.dir||''}</div>
      </div>
    </div>`;
  }).join('');
  return `<div class="cond-section" style="border-top:6px solid #f0f0f0">
    <div class="cond-title">📡 海の実測値 <span style="font-size:11px;font-weight:400;color:#888;float:right">観測 ${OBS.obs_time||'—'}・20分毎更新</span></div>
    ${rows}
    <div style="margin-top:6px;font-size:10px;color:#aaa">出典：${OBS.source}。予報でなく観測機が測った今の海。予報とのズレの答え合わせに使う。</div>
    <div style="margin-top:4px;font-size:10px;color:#aaa">✅ サイズ較正済み：2024年 鹿島実測8,778時間と突合（相関0.95・大波時はモデルが2割小さく出る癖を補正）</div>
  </div>`;
}

// ── タイドタブ描画 ──
function renderTide() {
  const now = new Date();
  const todayStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  const dow = ['日','月','火','水','木','金','土'][now.getDay()];
  const tideType = tideTypeName(now);

  const sunrise = DATA.weather.daily?.sunrise?.[0] ? new Date(DATA.weather.daily.sunrise[0]).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) : '--:--';
  const sunset  = DATA.weather.daily?.sunset?.[0]  ? new Date(DATA.weather.daily.sunset[0]).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) : '--:--';

  // 本物の潮汐（気象庁）があれば優先・なければサイン近似
  const tDay = tideDay(SPOT.area, now);
  let todayExtremes, srcNote;
  if (tDay) {
    todayExtremes = [
      ...tDay.hi.map(e => ({ type:'満潮', time:e[0], cm:e[1] })),
      ...tDay.lo.map(e => ({ type:'干潮', time:e[0], cm:e[1] })),
    ].sort((a,b) => a.time.localeCompare(b.time)).slice(0,4);
    srcNote = `気象庁 潮位表（${tDay.name}）`;
  } else {
    const fmt = t => `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
    todayExtremes = getTideExtremes(now, 30)
      .filter(e => e.t.getDate() === now.getDate())
      .slice(0,4).map(e => ({ type:e.type, time:fmt(e.t), cm:e.cm }));
    srcNote = '簡易計算（参考値）';
  }
  const tSt = tDay ? tideState(tDay, now) : null;

  document.getElementById('tideContent').innerHTML = `
    <div class="tide-header">
      <div>
        <div class="tide-date">${todayStr}（${dow}）</div>
        <div class="tide-sun">
          <span>🌅 SUNRISE ${sunrise}</span>
          <span>🌇 SUNSET ${sunset}</span>
        </div>
      </div>
      <div class="tide-type-badge">${tideType}${tSt ? '・'+tSt.label : ''}</div>
    </div>
    <div class="tide-graph-wrap">
      <div id="tideScroll" style="overflow-x:auto;-webkit-overflow-scrolling:touch">
        <canvas id="tideChart" height="120"></canvas>
      </div>
      <div style="text-align:center;font-size:10px;color:#8aa;padding-top:2px">← 左右にスワイプで3日後まで →</div>
      <div style="display:flex;gap:10px;justify-content:center;font-size:10px;color:#556;padding-top:4px;flex-wrap:wrap">
        <span>〰️ 潮位</span>
        <span><span style="display:inline-block;width:8px;height:10px;background:rgba(47,109,181,0.42);vertical-align:middle"></span> 波の大きさ</span>
        <span>⬆ 風（<span style="color:#00b359;font-weight:700">緑=オフ</span>・<span style="color:#f5a623;font-weight:700">黄=サイドオン</span>・<span style="color:#e74c3c;font-weight:700">赤=オン</span>・長さ=強さ）</span>
      </div>
    </div>
    <div class="tide-extremes">
      ${todayExtremes.map(e => `
        <div class="te-item">
          <div class="te-type">${e.type}</div>
          <div class="te-time">${e.time}</div>
          <div class="te-cm">${e.cm}cm</div>
        </div>`).join('')}
    </div>
    <div style="padding:7px 14px 9px;font-size:10px;color:#aaa;background:#fff;margin:0 8px;border-radius:0 0 14px 14px;box-shadow:0 1px 4px rgba(30,60,100,0.10)">📍 ${srcNote}</div>`;

  // グラフ描画
  requestAnimationFrame(() => drawTideChart(now));
}

function drawTideChart(now) {
  const canvas = document.getElementById('tideChart');
  if (!canvas) return;
  const DAYS = 4, PPH = 16;                     // 4日間・1時間=16px
  const PAD = { t:30, b:30, l:8, r:8 };
  const W = PAD.l + DAYS*24*PPH + PAD.r;
  const H = 188;
  canvas.width = W; canvas.height = H;
  canvas.style.width = W + 'px';
  const ctx = canvas.getContext('2d');
  const dows = ['日','月','火','水','木','金','土'];
  const day0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  // 4日分の毎時潮位（96時間・気象庁データ優先）
  const days = [];
  const tideHourly = [];
  for (let d = 0; d < DAYS; d++) {
    const dt = new Date(day0.getTime() + d*86400000);
    const td = tideDay(SPOT.area, dt);
    days.push({ dt, td });
    for (let h = 0; h < 24; h++) {
      tideHourly.push(td ? td.h[h] : tideCm(new Date(dt.getTime() + h*3600000)));
    }
  }
  const xAt = hf => PAD.l + hf * PPH;
  const cmAt = hf => {
    const i = Math.min(Math.floor(hf), tideHourly.length-1);
    const a = tideHourly[i], b = tideHourly[Math.min(i+1, tideHourly.length-1)];
    return a + (b - a) * (hf - i);
  };
  const minC = Math.min(...tideHourly), maxC = Math.max(...tideHourly);
  const scY = v => PAD.t + (1 - (v - minC) / ((maxC - minC) || 1)) * (H - PAD.t - PAD.b);

  // 潮位の面（グラデ）
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(91,139,184,0.35)');
  grad.addColorStop(1, 'rgba(91,139,184,0.04)');
  ctx.beginPath();
  ctx.moveTo(xAt(0), H - PAD.b);
  for (let hf = 0; hf <= DAYS*24; hf += 0.25) ctx.lineTo(xAt(hf), scY(cmAt(hf)));
  ctx.lineTo(xAt(DAYS*24), H - PAD.b);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  // 夜の影（日毎・日出前と日入後）
  ctx.fillStyle = 'rgba(100,120,150,0.16)';
  for (let d = 0; d < DAYS; d++) {
    const sr = DATA?.weather?.daily?.sunrise?.[d] ? new Date(DATA.weather.daily.sunrise[d]) : null;
    const ss = DATA?.weather?.daily?.sunset?.[d]  ? new Date(DATA.weather.daily.sunset[d])  : null;
    const f = t => t.getHours() + t.getMinutes()/60;
    const x0 = xAt(d*24), x1 = xAt(d*24 + (sr ? f(sr) : 4.5));
    ctx.fillRect(x0, PAD.t, x1 - x0, H - PAD.t - PAD.b);
    const x2 = xAt(d*24 + (ss ? f(ss) : 19)), x3 = xAt((d+1)*24);
    ctx.fillRect(x2, PAD.t, x3 - x2, H - PAD.t - PAD.b);
  }

  // 波の大きさバー（1時間毎・実効フェイス・96時間）
  const mh = DATA?.marine?.hourly;
  const day0Key = `${day0.getFullYear()}-${String(day0.getMonth()+1).padStart(2,'0')}-${String(day0.getDate()).padStart(2,'0')}`;
  if (mh) {
    const idx0 = mh.time.findIndex(t => t.startsWith(day0Key));
    if (idx0 >= 0) {
      const faces = [];
      for (let h = 0; h < DAYS*24 && idx0 + h < mh.time.length; h++) {
        const i = idx0 + h;
        faces.push(effectiveFace({ wave_height: mh.wave_height[i], swell_wave_height: mh.swell_wave_height?.[i],
          swell_wave_direction: mh.swell_wave_direction?.[i], wind_wave_height: mh.wind_wave_height?.[i],
          wave_direction: mh.wave_direction[i] }, SPOT.facing));
      }
      const maxF  = Math.max(1.0, ...faces);
      const bandH = (H - PAD.t - PAD.b) * 0.42;
      ctx.fillStyle = 'rgba(47,109,181,0.42)';
      faces.forEach((f, h) => {
        const bh = (f / maxF) * bandH;
        ctx.fillRect(xAt(h) + PPH*0.18, H - PAD.b - bh, PPH*0.64, bh);
      });
      // 日毎のピークサイズラベル
      ctx.font = 'bold 10px -apple-system,sans-serif'; ctx.textAlign = 'center';
      for (let d = 0; d < DAYS; d++) {
        const seg = faces.slice(d*24, d*24 + 24);
        if (!seg.length) break;
        const pk = seg.indexOf(Math.max(...seg));
        const fv = seg[pk];
        ctx.fillStyle = '#1a4a7a';
        const lx = Math.min(Math.max(xAt(d*24 + pk) + PPH/2, xAt(d*24) + 32), xAt((d+1)*24) - 32);
        ctx.fillText(`${fv.toFixed(1)}m ${jpOne(fv)}`, lx, H - PAD.b - (fv/maxF)*bandH - 4);
      }
    }
  }

  // 風の矢印（3時間毎・96時間・色=オン/オフ・長さ=強さ）
  const wh2 = DATA?.weather?.hourly;
  if (wh2) {
    const wIdx0 = wh2.time.findIndex(t => t.startsWith(day0Key));
    if (wIdx0 >= 0) {
      for (let h = 1; h < DAYS*24; h += 3) {
        const i = wIdx0 + h;
        if (i >= wh2.time.length) break;
        const ddeg = wh2.wind_direction_10m?.[i] ?? 0;
        const spd  = wh2.wind_speed_10m?.[i] ?? 0;
        const wtc  = windType(ddeg, SPOT.facing).cls;
        const col  = wtc==='off' ? '#00b359' : wtc==='sideoff' ? '#7cb342' : wtc==='sideon' ? '#f5a623' : '#e74c3c';
        const x = xAt(h) + PPH/2, y = 22;
        const len = Math.min(4 + spd * 0.9, 11);
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((ddeg + 180) * Math.PI / 180);
        ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, len*0.6); ctx.lineTo(0, -len*0.6); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -len*0.6 - 3.5); ctx.lineTo(-3.2, -len*0.6 + 2.5); ctx.lineTo(3.2, -len*0.6 + 2.5); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
    }
  }

  // 潮位ライン
  ctx.beginPath(); ctx.strokeStyle = '#5b8ab8'; ctx.lineWidth = 2.5;
  for (let hf = 0; hf <= DAYS*24; hf += 0.25) {
    const x = xAt(hf), y = scY(cmAt(hf));
    hf === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  // 満潮・干潮ドット＋ラベル（4日分）
  days.forEach(({ td }, d) => {
    if (!td) return;
    const ex = [...td.hi.map(e => ({type:'満潮', timeStr:e[0], cm:e[1]})),
                ...td.lo.map(e => ({type:'干潮', timeStr:e[0], cm:e[1]}))];
    ex.forEach(e => {
      const hf = d*24 + parseInt(e.timeStr.slice(0,2)) + parseInt(e.timeStr.slice(3,5))/60;
      const x = xAt(hf), y = scY(e.cm);
      ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI*2); ctx.fillStyle = '#5b8ab8'; ctx.fill();
      ctx.fillStyle = '#333'; ctx.font = 'bold 11px -apple-system,sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(`${e.cm}`, x, e.type === '満潮' ? y - 9 : y + 18);
      ctx.fillStyle = '#888'; ctx.font = '9px -apple-system,sans-serif';
      ctx.fillText(e.timeStr, x, e.type === '満潮' ? y - 20 : y + 29);
    });
  });

  // 日の境界線＋日付ラベル
  for (let d = 0; d < DAYS; d++) {
    const x = xAt(d*24);
    if (d > 0) {
      ctx.beginPath(); ctx.strokeStyle = 'rgba(40,60,90,0.35)'; ctx.lineWidth = 1.5;
      ctx.moveTo(x, 0); ctx.lineTo(x, H - PAD.b); ctx.stroke();
    }
    const dt = days[d].dt;
    const label = (d===0 ? '今日 ' : d===1 ? '明日 ' : '') + `${dt.getMonth()+1}/${dt.getDate()}(${dows[dt.getDay()]})［${tideTypeName(dt)}］`;
    ctx.fillStyle = '#1a4a7a'; ctx.font = 'bold 11px -apple-system,sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(label, x + 4, 11);
  }

  // X軸目盛り（3時間毎）
  ctx.fillStyle = '#888'; ctx.font = '10px -apple-system,sans-serif'; ctx.textAlign = 'center';
  for (let h = 0; h <= DAYS*24; h += 3) {
    const x = xAt(h);
    ctx.fillText(h % 24, x, H - 6);
    ctx.beginPath(); ctx.strokeStyle = 'rgba(0,0,0,0.08)'; ctx.lineWidth = 1;
    ctx.moveTo(x, PAD.t); ctx.lineTo(x, H - PAD.b); ctx.stroke();
  }

  // 現在時刻の赤い縦線
  const nowHf = (now - day0) / 3600000;
  const nx = xAt(nowHf);
  ctx.beginPath(); ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2;
  ctx.moveTo(nx, 13); ctx.lineTo(nx, H - PAD.b); ctx.stroke();

  // 初期スクロール位置を「今」に合わせる
  const sc = document.getElementById('tideScroll');
  if (sc && !sc.dataset.scrolled) {
    sc.scrollLeft = Math.max(0, nx - 70);
    sc.dataset.scrolled = '1';
  }
}

// ── 予報タブ描画 ──
function renderForecast() {
  if (!DATA?.marine?.hourly) return;
  const times  = DATA.marine.hourly.time;
  const whs    = DATA.marine.hourly.wave_height;
  const wds    = DATA.marine.hourly.wave_direction;
  const swhs   = DATA.marine.hourly.swell_wave_height ?? [];
  const swps   = DATA.marine.hourly.swell_wave_period ?? [];
  const swds   = DATA.marine.hourly.swell_wave_direction ?? [];
  const wwhs   = DATA.marine.hourly.wind_wave_height ?? [];
  const wtemps = DATA.weather.hourly?.temperature_2m ?? [];
  const wspdh  = DATA.weather.hourly?.wind_speed_10m ?? [];
  const wdirh  = DATA.weather.hourly?.wind_direction_10m ?? [];
  const wcodes = DATA.weather.hourly?.weather_code ?? [];
  const now    = new Date();

  // BCM風：横スクロールの時間カラム
  const ROWS = [['時刻',26],['天気',26],['気温',20],['風速',20],['風向',56],['波高',96],['周期',20],['波向',34]];
  const labelCol = ROWS.map(([l,h]) => `<div class="bcm-cell" style="height:${h}px">${l}</div>`).join('');
  const wtColor = { on:'#e74c3c', sideon:'#f5a623', sideoff:'#7cb342', off:'#00b359' };

  let html = '';
  let lastDate = '';
  let cols = '';
  const step = FC_INTERVAL;
  const flush = () => {
    if (cols) html += `<div class="bcm-wrap"><div class="bcm-labels">${labelCol}</div>${cols}</div>`;
    cols = '';
  };

  for (let i = 0; i < Math.min(times.length, 96); i++) {
    if (i % step !== 0) continue;
    const t = new Date(times[i]);
    if (t < new Date(now.getFullYear(), now.getMonth(), now.getDate())) continue;

    const dateStr = `${t.getMonth()+1}/${t.getDate()}`;
    const dow = ['日','月','火','水','木','金','土'][t.getDay()];
    const hStr = String(t.getHours()).padStart(2,'0');
    const hourMc = { wave_height: whs[i], swell_wave_height: swhs[i], swell_wave_direction: swds[i], wind_wave_height: wwhs[i], wave_direction: wds[i] };
    const wh   = effectiveFace(hourMc, SPOT.facing);
    const swp  = swps[i] ?? null;
    const wdeg = (swds[i] ?? wds[i]) ?? 0;
    const tmp  = wtemps[i] ?? '—';
    const spd  = wspdh[i] ?? 0;
    const ddeg = wdirh[i] ?? 0;
    const wc   = wcodes[i] ?? 0;
    const isNow= t.getHours()===now.getHours() && t.getDate()===now.getDate();
    const wt   = windType(ddeg, SPOT.facing);

    if (dateStr !== lastDate) {
      flush();
      const dayOff = Math.min(Math.max(t.getDate()-now.getDate(),0),3);
      const sr = DATA.weather.daily?.sunrise?.[dayOff] ? new Date(DATA.weather.daily.sunrise[dayOff]).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) : '—';
      const ss = DATA.weather.daily?.sunset?.[dayOff]  ? new Date(DATA.weather.daily.sunset[dayOff]).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) : '—';
      const dayLabel = t.getDate()===now.getDate() ? '今日' : t.getDate()===now.getDate()+1 ? '明日' : '';
      html += `<div class="fc-day-header">📅 ${dayLabel} ${dateStr}（${dow}）　日出 ${sr} / 日入 ${ss} [${tideTypeName(t)}]</div>`;
      lastDate = dateStr;
    }

    const barPct = Math.min(wh / 2.0, 1) * 100;                 // 2mでバー満タン
    const flowW  = (ddeg + 180) % 360;                          // 風の流れる方向（BCM式）
    const flowS  = (wdeg + 180) % 360;                          // うねいの進む方向
    cols += `<div class="bcm-col${isNow?' now':''}">
      <div class="bcm-cell" style="height:26px;font-weight:800;font-size:14px;color:#345">${hStr}</div>
      <div class="bcm-cell" style="height:26px;font-size:16px">${weatherEmoji(wc)}</div>
      <div class="bcm-cell" style="height:20px;font-size:11px;color:#555">${typeof tmp==='number'?tmp.toFixed(0)+'℃':'—'}</div>
      <div class="bcm-cell" style="height:20px;font-size:12px;font-weight:700;color:#345">${spd.toFixed(1)}</div>
      <div class="bcm-cell" style="height:56px;flex-direction:column;gap:1px">
        <span style="display:inline-block;transform:rotate(${flowW}deg);font-size:17px;color:${wtColor[wt.cls]};font-weight:900">➤</span>
        <span style="font-size:9px;color:#667">${dir(ddeg)}</span>
        <span class="wt-badge" style="background:${wtColor[wt.cls]}">${wt.label.replace('ショア','')}</span>
      </div>
      <div class="bcm-cell bcm-bar-area" style="height:96px">
        <div class="bcm-bar" style="height:${barPct}%"></div>
        <div style="position:absolute;top:6px;left:0;right:0;font-size:13px;font-weight:900;color:#1a4a7a">${wh.toFixed(2)}</div>
        <div style="position:absolute;top:24px;left:0;right:0;font-size:9px;font-weight:700;color:#2f6db5">${jpOne(wh)}</div>
      </div>
      <div class="bcm-cell" style="height:20px;font-size:10px;color:#555">${swp !== null ? swp.toFixed(0)+'秒' : '—'}</div>
      <div class="bcm-cell" style="height:34px;flex-direction:column">
        <span style="display:inline-block;transform:rotate(${flowS}deg);font-size:12px;color:#2f6db5">➤</span>
        <span style="font-size:9px;color:#667">${dir(wdeg)}</span>
      </div>
    </div>`;
  }
  flush();
  document.getElementById('forecastContent').innerHTML = html || '<div class="err">予報データなし</div>';
}

function setFcInterval(n) {
  FC_INTERVAL = n;
  document.getElementById('btn1h').classList.toggle('active', n===1);
  document.getElementById('btn3h').classList.toggle('active', n===3);
  renderForecast();
}

// ── ⭐評価（0〜100点 → 星1〜5）──
function scoreToStars(score) {
  const n = score >= 80 ? 5 : score >= 60 ? 4 : score >= 40 ? 3 : score >= 20 ? 2 : 1;
  return '⭐'.repeat(n) + '☆'.repeat(5 - n);
}

// ── コンディション点数（0〜100点）v2: うねり実効サイズ＋うねり周期＋潮 ──
function surfScore(face, swellPeriod, windDeg, wspd, facing, tideBonus = 0) {
  // サイズスコア（最大35点）：実効フェイス コシ〜ハラが最高
  let whScore = 0;
  if      (face < 0.2)  whScore = 2;
  else if (face < 0.35) whScore = 12;
  else if (face < 0.5)  whScore = 22;
  else if (face < 0.7)  whScore = 30;
  else if (face < 1.0)  whScore = 35;
  else if (face < 1.3)  whScore = 33;
  else if (face < 1.6)  whScore = 28;
  else if (face < 2.0)  whScore = 22;
  else                  whScore = 13;

  // 風向スコア（最大25点）
  const wt = windType(windDeg, facing);
  const wdScore = wt.cls==='off' ? 25 : wt.cls==='sideoff' ? 18 : wt.cls==='sideon' ? 8 : 2;

  // 風速スコア（最大15点）
  let wsScore = 0;
  if      (wspd < 2)  wsScore = 15;
  else if (wspd < 4)  wsScore = 13;
  else if (wspd < 6)  wsScore = 10;
  else if (wspd < 8)  wsScore = 6;
  else if (wspd < 11) wsScore = 3;
  else                wsScore = 0;

  // うねり周期スコア（最大20点）：周期が長い＝パワーと整い
  let wpScore = 0;
  if      (swellPeriod >= 13) wpScore = 20;
  else if (swellPeriod >= 11) wpScore = 17;
  else if (swellPeriod >= 9)  wpScore = 13;
  else if (swellPeriod >= 7)  wpScore = 8;
  else if (swellPeriod >= 6)  wpScore = 4;
  else                        wpScore = 1;

  return Math.max(0, Math.min(100, whScore + wdScore + wsScore + wpScore + tideBonus));
}

function scoreColor(score) {
  if (score >= 80) return '#00b359';
  if (score >= 60) return '#5b8ab8';
  if (score >= 40) return '#f5a623';
  return '#c0392b';
}

// ── 全スポット一覧 ──
async function renderSpotList() {
  const el = document.getElementById('listContent');
  el.innerHTML = '<div class="loading"><div class="spin">🌊</div><br>全スポット取得中...</div>';
  try {
    const results = await Promise.all(
      SPOTS.map(async sp => {
        try {
          const [mRes, wRes] = await Promise.all([
            fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${sp.lat}&longitude=${sp.lon}&current=wave_height,wave_period,wave_direction,swell_wave_height,swell_wave_period,swell_wave_direction,wind_wave_height&timezone=Asia%2FTokyo`),
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${sp.lat}&longitude=${sp.lon}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo`)
          ]);
          const mc = (await mRes.json()).current;
          const wc = (await wRes.json()).current;
          return { sp, mc, wc, ok: true };
        } catch(e) { return { sp, ok: false }; }
      })
    );

    const areas = [...new Set(SPOTS.map(s => s.area))];
    let html = '';
    areas.forEach(area => {
      html += `<div class="spot-area-hdr">${area}</div>`;
      results.filter(r => r.sp.area === area).forEach(({ sp, mc, wc, ok }) => {
        if (!ok) {
          html += `<div class="spot-card" style="border-left-color:#ccc" onclick="goSpot('${sp.id}')">
            <div class="spot-visual" style="background:#aaa">⚠️</div>
            <div class="spot-info"><div class="spot-name">${sp.name}</div><div class="spot-jp" style="font-size:14px;color:#c00">取得失敗</div></div>
          </div>`;
          return;
        }
        const wh   = effectiveFace(mc, sp.facing);
        const wp   = mc.swell_wave_period ?? mc.wave_period ?? 0;
        const wdeg = wc.wind_direction_10m ?? 0;
        const wspd = wc.wind_speed_10m ?? 0;
        const wt   = windType(wdeg, sp.facing);
        const jp   = bcmSize(wh);
        const tDay = tideDay(sp.area);
        const score= surfScore(wh, wp, wdeg, wspd, sp.facing, tDay ? tidePrefBonus(sp, tDay) : 0);
        const col  = scoreColor(score);
        const arrowColor = wt.cls==='off' ? '#00b359' : wt.cls==='sideoff' ? '#5b8ab8' : wt.cls==='sideon' ? '#f5a623' : '#c0392b';
        const isCurrent = sp.id === SPOT.id;

        html += `<div class="spot-card${isCurrent?' current':''}" style="border-left-color:${col}" onclick="goSpot('${sp.id}')">
          <div class="spot-visual" style="background:${arrowColor}">
            <div class="wv-arrow" style="transform:rotate(${wdeg}deg)">▲</div>
            <div class="wv-label">${wt.short.replace('\n',' ')}</div>
          </div>
          <div class="spot-info">
            <div class="spot-name">${sp.name}${isCurrent ? ' <span style="font-size:9px;background:#5b8ab8;color:#fff;padding:1px 4px;border-radius:6px;vertical-align:middle">表示中</span>' : ''}</div>
            <div class="spot-jp">${jp}<span class="spot-jp-sub">${wh.toFixed(2)}m / ${wp.toFixed(0)}s</span></div>
            <div class="spot-wind-row">${wt.label}｜${wspd.toFixed(1)}m/s ${dir(wdeg)}</div>
          </div>
          <div class="spot-score-wrap">
            <div class="spot-stars">${scoreToStars(score)}</div>
          </div>
        </div>`;
      });
    });

    const now = new Date();
    html = `<div style="padding:8px 16px 2px;font-size:11px;color:#789">
      ${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 現在 ─ タップで詳細表示
    </div>` + html;
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="err">⚠️ 取得失敗<br><small>${e.message}</small></div>`;
  }
}

function goSpot(spotId) {
  selectSpot(spotId);
  showTab('wave');
}

function showTab(tab) {
  document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.htab').forEach(el => el.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  const idx = ['list','wave','tide','weather'].indexOf(tab);
  document.querySelectorAll('.htab')[idx].classList.add('active');
  if (tab==='list')    renderSpotList();
  if (tab==='tide') {
    requestAnimationFrame(() => { if(DATA) drawTideChart(new Date()); });
    if(DATA) renderForecast();
  }
  if (tab==='weather') renderWeather();
}
