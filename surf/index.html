<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#e8eef4;color:#222;font-family:-apple-system,'Hiragino Sans',sans-serif;max-width:480px;margin:0 auto;min-height:100vh}

/* ヘッダー */
.hdr{background:#5b8ab8;padding:10px 14px 0;color:#fff}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.hdr-title{font-size:18px;font-weight:700;letter-spacing:1px}
.hdr-refresh{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:0 4px}
.hdr-tabs{display:flex;gap:2px}
.htab{flex:1;text-align:center;padding:8px 4px 6px;font-size:13px;color:rgba(255,255,255,0.75);cursor:pointer;border-radius:8px 8px 0 0;background:rgba(255,255,255,0.1)}
.htab.active{background:#fff;color:#5b8ab8;font-weight:700}

/* タブコンテンツ */
.tab-body{background:#fff}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ===== 波情報タブ ===== */
/* メインビジュアル */
.wave-visual{position:relative;background:linear-gradient(180deg,#87ceeb 0%,#87ceeb 45%,#5b9bd5 45%,#4a8cc4 60%,#d4a96a 60%,#c9975a 68%,#b8864a 68%,#7a6040 100%);height:210px;overflow:hidden}
.wave-visual .wv-top{position:absolute;top:10px;right:12px;text-align:right;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,0.5);font-size:12px;line-height:1.6}
.wave-visual .wv-size-block{position:absolute;top:12px;left:14px;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,0.6)}
.wv-tri{font-size:28px;color:#5ee8ff;line-height:1}
.wv-num{font-size:56px;font-weight:700;color:#5ee8ff;line-height:1;margin-left:2px}
.wv-jpname{font-size:15px;font-weight:600;color:#fff;margin-top:2px}
/* 風向矢印（大） */
.wind-arrow-wrap{position:absolute;top:50%;left:50%;transform:translate(-50%,-40%);pointer-events:none}
.wind-arr-svg{width:140px;height:60px;opacity:0.85}
.side-label{position:absolute;top:55%;left:50%;transform:translateX(-50%);font-size:20px;font-weight:900;color:rgba(255,255,255,0.9);text-shadow:0 1px 6px rgba(0,0,0,0.5);letter-spacing:2px}
/* 砂浜の人 */
.surfer-wrap{position:absolute;bottom:42%;left:14px}
.surfer-svg{width:50px;height:90px;opacity:0.9}
/* ビーチ下部 */
.wave-info-bar{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,0.25);display:flex;align-items:center;gap:12px;padding:5px 12px;font-size:12px;color:#fff}

/* データカード */
.data-cards{display:flex;border-bottom:1px solid #e0e0e0}
.dc{flex:1;display:flex;align-items:center;gap:6px;padding:10px 12px;border-right:1px solid #e0e0e0}
.dc:last-child{border-right:none}
.dc-icon{font-size:22px}
.dc-label{font-size:10px;color:#888;display:block}
.dc-val{font-size:15px;font-weight:700;color:#5b8ab8}

/* コンディション */
.cond-section{padding:12px 14px;border-bottom:1px solid #e8e8e8}
.cond-title{font-size:15px;font-weight:700;color:#5b8ab8;margin-bottom:8px}
.cond-row{display:flex;padding:4px 0;border-bottom:1px dotted #eee;font-size:13px}
.cond-row:last-child{border-bottom:none}
.cond-key{color:#5b8ab8;font-weight:600;width:50px;flex-shrink:0}
.cond-val{color:#444;flex:1}

/* カメラリンク */
.cam-section{padding:12px 14px;border-bottom:1px solid #e8e8e8}
.cam-title{font-size:14px;font-weight:700;color:#5b8ab8;margin-bottom:8px}
.cam-links{display:flex;flex-direction:column;gap:6px}
.cam-link{display:flex;align-items:center;gap:8px;background:#f0f6ff;border-radius:8px;padding:8px 12px;text-decoration:none;color:#333;font-size:13px}
.cam-link-icon{font-size:18px}

/* ===== タイドタブ ===== */
.tide-header{background:#f8f9fa;border-bottom:1px solid #e0e0e0;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.tide-date{font-size:15px;font-weight:700;color:#5b8ab8}
.tide-type-badge{background:#5b8ab8;color:#fff;font-size:12px;padding:3px 8px;border-radius:12px}
.tide-sun{font-size:12px;color:#888;display:flex;gap:12px}
.tide-graph-wrap{background:#e8f0f8;padding:14px;position:relative}
canvas#tideChart{width:100%!important;display:block}
.tide-extremes{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;padding:10px 12px;background:#fff;border-bottom:1px solid #e0e0e0}
.te-item{text-align:center;background:#f0f6ff;border-radius:8px;padding:6px 4px}
.te-type{font-size:10px;color:#888;margin-bottom:2px}
.te-time{font-size:14px;font-weight:700;color:#333}
.te-cm{font-size:12px;color:#5b8ab8;font-weight:600}

/* ===== 予報タブ ===== */
.fc-toggle{display:flex;margin:10px 12px;border:2px solid #5b8ab8;border-radius:8px;overflow:hidden}
.fc-toggle-btn{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:#5b8ab8}
.fc-toggle-btn.active{background:#5b8ab8;color:#fff}
.fc-day-header{background:#e8eef4;padding:8px 14px;font-size:14px;font-weight:700;color:#5b8ab8;border-top:2px solid #5b8ab8}
.fc-table-wrap{overflow-x:auto;border-bottom:2px solid #5b8ab8}
.fc-table{border-collapse:collapse;min-width:100%;font-size:12px;background:#fff}
.fc-table th{background:#dce8f4;padding:5px 8px;text-align:center;white-space:nowrap;border-right:1px solid #ccc;color:#555;font-weight:600;font-size:11px;position:sticky;left:0;z-index:1}
.fc-table td{padding:7px 10px;text-align:center;border-right:1px solid #eee;border-bottom:1px solid #eee;white-space:nowrap}
.fc-table tr:nth-child(even) td{background:#f8fbff}
.fc-now td{background:#fff3cd!important}
.fc-wind-arrow{display:inline-block;font-size:16px}
.fc-wh{font-weight:700;color:#5b8ab8}

/* カメラセクション */
.cam-section{padding:12px 14px;border-bottom:1px solid #e8e8e8}
.cam-title{font-size:14px;font-weight:700;color:#5b8ab8;margin-bottom:8px}
.cam-area-header{font-size:13px;font-weight:700;color:#fff;background:#5b8ab8;border-radius:6px;padding:4px 10px;margin-bottom:6px}
.cam-links{display:flex;flex-direction:column;gap:6px;margin-bottom:4px}
.cam-link{display:flex;align-items:center;gap:10px;background:#f0f6ff;border-radius:8px;padding:9px 12px;text-decoration:none;color:#333;font-size:13px;font-weight:600}
.cam-link-icon{font-size:20px;flex-shrink:0}
.cam-sub{font-size:11px;color:#888;font-weight:400;display:block;margin-top:1px}

/* ローディング */
.loading{text-align:center;padding:60px 20px;color:#5b8ab8}
.spin{font-size:36px;animation:spin 1.5s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.err{background:#ffeaea;border-radius:8px;padding:12px;margin:12px;font-size:13px;color:#c00}

/* ===== 一覧タブ ===== */
.spot-area-hdr{background:#dce8f4;padding:7px 14px;font-size:12px;font-weight:700;color:#5b8ab8;letter-spacing:1px}
.spot-card{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer;background:#fff;gap:10px;-webkit-tap-highlight-color:rgba(91,138,184,0.1)}
.spot-card.current{background:#f0f6ff}
.spot-visual{width:66px;height:62px;border-radius:8px;overflow:hidden;flex-shrink:0;background:linear-gradient(180deg,#87ceeb 0%,#5b9bd5 55%,#d4a96a 55%,#b8864a 100%);position:relative;display:flex;align-items:center;justify-content:center}
.spot-info{flex:1;min-width:0}
.spot-name{font-size:14px;font-weight:700;color:#333}
.spot-jp{font-size:12px;color:#5b8ab8;font-weight:600;margin-top:1px}
.spot-wind-row{font-size:11px;color:#888;margin-top:2px}
.spot-score-wrap{flex-shrink:0;text-align:right;min-width:72px}
.spot-stars{font-size:14px;line-height:1.3;letter-spacing:1px}
.spot-wave-score{font-size:18px;font-weight:900;color:#5b8ab8;line-height:1;margin-top:3px}
.spot-wave-score span{font-size:10px;color:#888;font-weight:400}
.spot-wh-small{font-size:11px;color:#5b8ab8;font-weight:600;margin-top:2px}

/* ボトムナビ */
.bnav{height:60px} /* スペーサー */
</style>
</head>

// ── 方向・コンディション計算 ──
const DIR_LABELS = ['北','北北東','北東','東北東','東','東南東','南東','南南東','南','南南西','南西','西南西','西','西北西','北西','北北西'];
const ARROW_CHARS = ['↑','↗','↗','→','→','↘','↘','↓','↓','↙','↙','←','←','↖','↖','↑'];
const dir = d => DIR_LABELS[Math.round(d/22.5)%16];
const arrChar = d => ARROW_CHARS[Math.round(d/22.5)%16];

function windType(windDeg, facing) {
  let diff = ((windDeg - facing) + 360) % 360;
  if (diff > 180) diff = 360 - diff;
  const cross = ((windDeg - facing + 360) % 360) < 180;
  if (diff <= 30)  return {label:'オンショア', short:'ON', cls:'on'};
  if (diff <= 70)  return {label: cross ? 'サイドオン' : 'サイドオン', short:'SIDE\nON', cls:'sideon'};
  if (diff <= 120) return {label: cross ? 'サイドオフ' : 'サイドオフ', short:'SIDE\nOFF', cls:'sideoff'};
  return {label:'オフショア', short:'OFF', cls:'off'};
}

function windStr(spd) {
  if (spd < 3)  return '';
  if (spd < 5)  return '（弱）';
  if (spd < 8)  return '（やや強）';
  if (spd < 12) return '（強）';
  return '（非常に強）';
}

function waveJP(h) {
  if (h < 0.3) return 'ヒザ以下';
  if (h < 0.5) return 'ヒザ';
  if (h < 0.7) return 'モモ';
  if (h < 0.9) return 'コシ';
  if (h < 1.2) return 'ハラ';
  if (h < 1.5) return 'ハラ〜ムネ';
  if (h < 1.7) return 'ムネ';
  if (h < 2.0) return 'ムネ〜カタ';
  if (h < 2.4) return 'カタ〜カオ';
  if (h < 3.0) return 'アタマ';
  return 'オーバーヘッド';
}

function waveNum(h) {
  // BCM▽スケール近似
  if (h < 0.3) return {num:'×5', isX:true};
  if (h < 0.5) return {num:'×10', isX:true};
  if (h < 0.8) return {num:'10', isX:false};
  if (h < 1.1) return {num:'15', isX:false};
  if (h < 1.4) return {num:'20', isX:false};
  if (h < 1.7) return {num:'25', isX:false};
  if (h < 2.0) return {num:'30', isX:false};
  if (h < 2.5) return {num:'35', isX:false};
  return {num:'40+', isX:false};
}

function conditionText(wh, wp, wt) {
  const face = {
    wave: wt.cls==='off' && wp>8 ? 'クリーン' :
          wt.cls==='sideoff' && wp>7 ? 'まぁまぁ' :
          wt.cls==='sideon' ? 'やや荒れ' : '荒れ',
    swell: wp>10 ? 'まとまったうねり' : wp>8 ? 'ほぼまとまっている' : wp>6 ? 'ややまとまりがない状態' : 'まとまりがない状態',
    count: wh>1.2 ? 'セットが入る。波数はある' : wh>0.7 ? '波数はほどほど' : '波数は少ない',
    pos: '—'
  };
  return face;
}

// ── 天気コード絵文字 ──
function weatherEmoji(code) {
  if (code === 0) return '☀️';
  if (code <= 3)  return '🌤️';
  if (code <= 48) return '🌫️';
  if (code <= 57) return '🌦️';
  if (code <= 67) return '🌧️';
  if (code <= 77) return '❄️';
  if (code <= 82) return '🌧️';
  if (code <= 86) return '🌨️';
  return '⛈️';
}

// ── 潮汐サイン近似（和田浦基準） ──
// 参照: 2026/04/28 02:35 JST = 満潮 134cm
const TIDE_REF   = new Date('2026-04-28T02:35:00+09:00').getTime();
const TIDE_PERIOD = 12.42 * 3600 * 1000;
const TIDE_AMP   = 38;
const TIDE_MEAN  = 90;
function tideCm(d) {
  const dt = d.getTime() - TIDE_REF;
  return Math.round(TIDE_MEAN + TIDE_AMP * Math.cos(2 * Math.PI * dt / TIDE_PERIOD));
}

// 極値（干満潮）を検出
function getTideExtremes(baseDate, hours=48) {
  const pts = [];
  for (let m = 0; m <= hours*60; m += 10) {
    const t = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate(), 0, m);
    pts.push({t, cm: tideCm(t)});
  }
  const ex = [];
  for (let i = 1; i < pts.length-1; i++) {
    const p = pts[i-1].cm, c = pts[i].cm, n = pts[i+1].cm;
    if (c > p && c > n) ex.push({...pts[i], type:'満潮'});
    if (c < p && c < n) ex.push({...pts[i], type:'干潮'});
  }
  return ex;
}

// 月齢から潮の種類
function tideTypeName(date) {
  const ref = new Date('2000-01-06T18:14:00Z').getTime();
  const days = (date - ref) / 86400000;
  const phase = ((days % 29.53058867) + 29.53058867) % 29.53058867;
  if (phase < 1.5 || phase > 28 || (phase > 13.5 && phase < 16)) return '大潮';
  if ((phase >= 1.5 && phase < 4) || (phase >= 11 && phase < 13.5) || (phase >= 16 && phase < 18) || (phase >= 25 && phase < 28)) return '中潮';
  if ((phase >= 4 && phase < 7) || (phase >= 18 && phase < 21)) return '小潮';
  if ((phase >= 7 && phase < 8) || (phase >= 21 && phase < 22)) return '長潮';
  if ((phase >= 8 && phase < 9.5) || (phase >= 22 && phase < 24)) return '若潮';
  return '中潮';
}

// ── APIデータ取得 ──
async function loadAll() {
  document.getElementById('checkTime').textContent = '更新中...';
  try {
    const [mRes, wRes] = await Promise.all([
      fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${SPOT.lat}&longitude=${SPOT.lon}&current=wave_height,wave_period,wave_direction,sea_surface_temperature&hourly=wave_height,wave_period,wave_direction,sea_surface_temperature&timezone=Asia%2FTokyo&forecast_days=4`),
      fetch(`https://api.open-meteo.com/v1/forecast?latitude=${SPOT.lat}&longitude=${SPOT.lon}&current=wind_speed_10m,wind_direction_10m,temperature_2m,weather_code&hourly=wind_speed_10m,wind_direction_10m,temperature_2m,weather_code,precipitation_probability&daily=sunrise,sunset&wind_speed_unit=ms&timezone=Asia%2FTokyo&forecast_days=4`)
    ]);
    DATA = { marine: await mRes.json(), weather: await wRes.json() };
    const now = new Date();
    document.getElementById('checkTime').textContent = `check ${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
    renderWave();
    renderTide();
    renderForecast();
  } catch(e) {
    document.getElementById('checkTime').textContent = '取得失敗';
    ['waveContent','tideContent','forecastContent'].forEach(id => {
      document.getElementById(id).innerHTML = `<div class="err">⚠️ データ取得失敗。通信状況を確認してください。<br><small>${e.message}</small></div>`;
    });
  }
}

// ── タイドタブ描画 ──
function renderTide() {
  const now = new Date();
  const todayStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  const dow = ['日','月','火','水','木','金','土'][now.getDay()];
  const tideType = tideTypeName(now);

  const sunrise = DATA.weather.daily?.sunrise?.[0] ? new Date(DATA.weather.daily.sunrise[0]).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) : '--:--';
  const sunset  = DATA.weather.daily?.sunset?.[0]  ? new Date(DATA.weather.daily.sunset[0]).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}) : '--:--';

  const extremes = getTideExtremes(now, 30).filter(e => {
    return e.t >= new Date(now.getFullYear(), now.getMonth(), now.getDate()) &&
           e.t < new Date(now.getFullYear(), now.getMonth(), now.getDate()+2);
  });
  const todayExtremes = extremes.filter(e => e.t.getDate() === now.getDate()).slice(0,4);

  const fmt = t => `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;

  document.getElementById('tideContent').innerHTML = `
    <div class="tide-header">
      <div>
        <div class="tide-date">${todayStr}（${dow}）</div>
        <div class="tide-sun">
          <span>🌅 SUNRISE ${sunrise}</span>
          <span>🌇 SUNSET ${sunset}</span>
        </div>
      </div>
      <div class="tide-type-badge">${tideType}</div>
    </div>
    <div class="tide-graph-wrap">
      <canvas id="tideChart" height="120"></canvas>
    </div>
    <div class="tide-extremes">
      ${todayExtremes.map(e => `
        <div class="te-item">
          <div class="te-type">${e.type}</div>
          <div class="te-time">${fmt(e.t)}</div>
          <div class="te-cm">${e.cm}cm</div>
        </div>`).join('')}
    </div>`;

  // グラフ描画
  requestAnimationFrame(() => drawTideChart(now));
}

function drawTideChart(now) {
  const canvas = document.getElementById('tideChart');
  if (!canvas) return;
  canvas.width = canvas.parentElement.offsetWidth;
  canvas.height = 140;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const PAD = { t:10, b:30, l:8, r:8 };

  // 今日0時〜24時の10分刻み
  const pts = [];
  for (let m = 0; m <= 24*60; m += 10) {
    const t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, m);
    pts.push({ t, cm: tideCm(t) });
  }
  const minC = Math.min(...pts.map(p=>p.cm));
  const maxC = Math.max(...pts.map(p=>p.cm));
  const scX = i => PAD.l + (i / (pts.length-1)) * (W - PAD.l - PAD.r);
  const scY = v => PAD.t + (1 - (v - minC) / (maxC - minC)) * (H - PAD.t - PAD.b);

  // 背景グラデ
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, 'rgba(91,139,184,0.4)');
  grad.addColorStop(1, 'rgba(91,139,184,0.05)');
  ctx.beginPath();
  ctx.moveTo(scX(0), H - PAD.b);
  pts.forEach((p,i) => ctx.lineTo(scX(i), scY(p.cm)));
  ctx.lineTo(scX(pts.length-1), H - PAD.b);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // ライン
  ctx.beginPath();
  ctx.strokeStyle = '#5b8ab8';
  ctx.lineWidth = 2.5;
  pts.forEach((p,i) => i===0 ? ctx.moveTo(scX(i), scY(p.cm)) : ctx.lineTo(scX(i), scY(p.cm)));
  ctx.stroke();

  // 極値にドット+ラベル
  const ex = getTideExtremes(now, 26).filter(e => e.t.getDate() === now.getDate());
  ex.forEach(e => {
    const fracOfDay = (e.t.getHours()*60 + e.t.getMinutes()) / (24*60);
    const idx = Math.round(fracOfDay * (pts.length-1));
    const x = scX(idx), y = scY(e.cm);
    ctx.beginPath();
    ctx.arc(x, y, 5, 0, Math.PI*2);
    ctx.fillStyle = '#5b8ab8';
    ctx.fill();
    ctx.fillStyle = '#333';
    ctx.font = 'bold 11px -apple-system,sans-serif';
    ctx.textAlign = 'center';
    const labelY = e.type==='満潮' ? y - 10 : y + 20;
    ctx.fillText(`${e.cm}cm`, x, labelY);
    ctx.fillStyle = '#888';
    ctx.font = '10px -apple-system,sans-serif';
    ctx.fillText(`${String(e.t.getHours()).padStart(2,'0')}:${String(e.t.getMinutes()).padStart(2,'0')}`, x, e.type==='満潮' ? y - 22 : y + 32);
  });

  // 現在時刻の縦線
  const nowFrac = (now.getHours()*60 + now.getMinutes()) / (24*60);
  const nx = PAD.l + nowFrac * (W - PAD.l - PAD.r);
  ctx.beginPath();
  ctx.strokeStyle = '#5b8ab8';
  ctx.lineWidth = 2;
  ctx.setLineDash([]);
  ctx.moveTo(nx, 0);
  ctx.lineTo(nx, H - PAD.b);
  ctx.stroke();

  // X軸目盛り（0,2,4...24）
  ctx.fillStyle = '#888';
  ctx.font = '10px -apple-system,sans-serif';
  ctx.textAlign = 'center';
  for (let h = 0; h <= 24; h += 2) {
    const x = PAD.l + (h/24) * (W - PAD.l - PAD.r);
    ctx.fillText(h, x, H - 6);
    ctx.beginPath();
    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
    ctx.lineWidth = 1;
    ctx.setLineDash([]);
    ctx.moveTo(x, PAD.t);
    ctx.lineTo(x, H - PAD.b);
    ctx.stroke();
  }
}

// ── 予報タブ描画 ──
function renderForecast() {
  if (!DATA?.marine?.hourly) return;
  const times  = DATA.marine.hourly.time;
  const whs    = DATA.marine.hourly.wave_height;
  const wds    = DATA.marine.hourly.wave_direction;
  const wtemps = DATA.weather.hourly?.temperature_2m ?? [];
  const wspdh  = DATA.weather.hourly?.wind_speed_10m ?? [];
  const wdirh  = DATA.weather.hourly?.wind_direction_10m ?? [];
  const wcodes = DATA.weather.hourly?.weather_code ?? [];
  const now    = new Date();

  let html = '';
  let lastDate = '';
  let rows = '';
  const step = FC_INTERVAL;

  for (let i = 0; i < Math.min(times.length, 96); i++) {
    if (i % step !== 0) continue;
    const t = new Date(times[i]);
    if (t < new Date(now.getFullYear(), now.getMonth(), now.getDate())) continue;

    const dateStr = `${t.getMonth()+1}/${t.getDate()}`;
    const dow = ['日','月','火','水','木','金','土'][t.getDay()];
    const hStr = String(t.getHours()).padStart(2,'0');
    const wh   = (whs[i] ?? 0) * SURF_FACTOR;
    const wdeg = wds[i] ?? 0;
    const tmp  = wtemps[i] ?? '—';
    const spd  = wspdh[i] ?? 0;
    const ddeg = wdirh[i] ?? 0;
    const wc   = wcodes[i] ?? 0;
    const isNow= t.getHours()===now.getHours() && t.getDate()===now.getDate();

    if (dateStr !== lastDate) {
      if (rows) html += `<div class="fc-table-wrap"><table class="fc-table"><tbody>${rows}</tbody></table></div>`;
      html += `<div class="fc-day-header">📅 今日 ${dateStr}（${dow}）　日出 ${DATA.weather.daily?.sunrise?.[0]?new Date(DATA.weather.daily.sunrise[Math.min(t.getDate()-now.getDate(),3)]).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—'} / 日入 ${DATA.weather.daily?.sunset?.[0]?new Date(DATA.weather.daily.sunset[Math.min(t.getDate()-now.getDate(),3)]).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}):'—'} [${tideTypeName(t)}]</div>`;
      rows = `<tr><th>時刻</th><th>天気</th><th>気温</th><th>風速</th><th>風向</th><th>波高</th><th>波向</th></tr>`;
      lastDate = dateStr;
    }
    rows += `<tr class="${isNow?'fc-now':''}">
      <td><b>${hStr}</b></td>
      <td>${weatherEmoji(wc)}</td>
      <td>${typeof tmp==='number'?tmp.toFixed(1)+'℃':'—'}</td>
      <td>${spd.toFixed(1)}m/s</td>
      <td><span class="fc-wind-arrow" style="display:inline-block;transform:rotate(${ddeg}deg)">↑</span><br><span style="font-size:10px">${dir(ddeg)}</span></td>
      <td class="fc-wh">${wh.toFixed(2)}m</td>
      <td><span style="display:inline-block;transform:rotate(${wdeg}deg)">↑</span><br><span style="font-size:10px">${dir(wdeg)}</span></td>
    </tr>`;
  }
  if (rows) html += `<div class="fc-table-wrap"><table class="fc-table"><tbody>${rows}</tbody></table></div>`;
  document.getElementById('forecastContent').innerHTML = html || '<div class="err">予報データなし</div>';
}

function setFcInterval(n) {
  FC_INTERVAL = n;
  document.getElementById('btn1h').classList.toggle('active', n===1);
  document.getElementById('btn3h').classList.toggle('active', n===3);
  renderForecast();
}

// ── ⭐評価（0〜100点 → 星1〜5）──
function scoreToStars(score) {
  const n = score >= 80 ? 5 : score >= 60 ? 4 : score >= 40 ? 3 : score >= 20 ? 2 : 1;
  return '⭐'.repeat(n) + '☆'.repeat(5 - n);
}

// ── コンディション点数（0〜100点） ──
function surfScore(wh, wp, windDeg, wspd, facing) {
  // 波高スコア（最大40点）：コシ〜ムネが最高
  let whScore = 0;
  if      (wh < 0.3)  whScore = 5;
  else if (wh < 0.5)  whScore = 25;
  else if (wh < 0.7)  whScore = 33;
  else if (wh < 0.9)  whScore = 37;
  else if (wh < 1.1)  whScore = 40;
  else if (wh < 1.4)  whScore = 38;
  else if (wh < 1.7)  whScore = 35;
  else if (wh < 2.0)  whScore = 30;
  else if (wh < 2.5)  whScore = 23;
  else                whScore = 15;

  // 風向スコア（最大25点）
  const wt = windType(windDeg, facing);
  const wdScore = wt.cls==='off' ? 25 : wt.cls==='sideoff' ? 18 : wt.cls==='sideon' ? 8 : 2;

  // 風速スコア（最大20点）
  let wsScore = 0;
  if      (wspd < 2)  wsScore = 20;
  else if (wspd < 4)  wsScore = 17;
  else if (wspd < 6)  wsScore = 13;
  else if (wspd < 8)  wsScore = 8;
  else if (wspd < 11) wsScore = 4;
  else                wsScore = 0;

  // 周期スコア（最大15点）
  let wpScore = 0;
  if      (wp >= 12) wpScore = 15;
  else if (wp >= 10) wpScore = 12;
  else if (wp >= 8)  wpScore = 8;
  else if (wp >= 6)  wpScore = 4;
  else               wpScore = 1;

  return Math.min(100, whScore + wdScore + wsScore + wpScore);
}

function scoreColor(score) {
  if (score >= 80) return '#00b359';
  if (score >= 60) return '#5b8ab8';
  if (score >= 40) return '#f5a623';
  return '#c0392b';
}

// ── 全スポット一覧 ──
async function renderSpotList() {
  const el = document.getElementById('listContent');
  el.innerHTML = '<div class="loading"><div class="spin">🌊</div><br>全スポット取得中...</div>';
  try {
    const results = await Promise.all(
      SPOTS.map(async sp => {
        try {
          const [mRes, wRes] = await Promise.all([
            fetch(`https://marine-api.open-meteo.com/v1/marine?latitude=${sp.lat}&longitude=${sp.lon}&current=wave_height,wave_period,wave_direction&timezone=Asia%2FTokyo`),
            fetch(`https://api.open-meteo.com/v1/forecast?latitude=${sp.lat}&longitude=${sp.lon}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=ms&timezone=Asia%2FTokyo`)
          ]);
          const mc = (await mRes.json()).current;
          const wc = (await wRes.json()).current;
          return { sp, mc, wc, ok: true };
        } catch(e) { return { sp, ok: false }; }
      })
    );

    const areas = [...new Set(SPOTS.map(s => s.area))];
    let html = '';
    areas.forEach(area => {
      html += `<div class="spot-area-hdr">${area}</div>`;
      results.filter(r => r.sp.area === area).forEach(({ sp, mc, wc, ok }) => {
        if (!ok) {
          html += `<div class="spot-card" onclick="goSpot('${sp.id}')">
            <div class="spot-visual"></div>
            <div class="spot-info"><div class="spot-name">${sp.name}</div><div class="spot-jp" style="color:#c00">取得失敗</div></div>
          </div>`;
          return;
        }
        const wh   = (mc.wave_height ?? 0) * SURF_FACTOR;
        const wp   = mc.wave_period ?? 0;
        const wdeg = wc.wind_direction_10m ?? 0;
        const wspd = wc.wind_speed_10m ?? 0;
        const wt   = windType(wdeg, sp.facing);
        const jp   = waveJP(wh);
        const wn   = waveNum(wh);
        const score= surfScore(wh, wp, wdeg, wspd, sp.facing);
        const col  = scoreColor(score);
        const arrowColor = wt.cls==='off' ? '#4aff84' : wt.cls==='sideoff' ? '#a4ff4a' : wt.cls==='sideon' ? '#ffd04a' : '#ff6b4a';
        const isCurrent = sp.id === SPOT.id;

        html += `<div class="spot-card${isCurrent?' current':''}" onclick="goSpot('${sp.id}')">
          <div class="spot-visual">
            <div style="transform:rotate(${wdeg}deg);width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:38px solid ${arrowColor};opacity:0.9"></div>
            <div style="position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:9px;font-weight:900;color:rgba(255,255,255,0.95)">${wt.short.replace('\n',' ')}</div>
          </div>
          <div class="spot-info">
            <div class="spot-name">${sp.name}${isCurrent ? ' <span style="font-size:9px;background:#5b8ab8;color:#fff;padding:1px 4px;border-radius:6px;vertical-align:middle">表示中</span>' : ''}</div>
            <div class="spot-jp">${jp}　<span style="font-weight:400;color:#888">${wh.toFixed(2)}m / ${wp.toFixed(0)}s</span></div>
            <div class="spot-wind-row">${wt.label}（${wspd.toFixed(1)}m/s）${dir(wdeg)}</div>
          </div>
          <div class="spot-score-wrap">
            <div class="spot-stars">${scoreToStars(score)}</div>
            <div class="spot-wave-score">${wn.num}<span>/50</span></div>
          </div>
        </div>`;
      });
    });

    const now = new Date();
    html = `<div style="background:#f8f9fa;padding:6px 14px;font-size:11px;color:#888;border-bottom:1px solid #e0e0e0">
      ${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')} 現在 ─ タップで詳細表示
    </div>` + html;
    el.innerHTML = html;
  } catch(e) {
    el.innerHTML = `<div class="err">⚠️ 取得失敗<br><small>${e.message}</small></div>`;
  }
}

function goSpot(spotId) {
  selectSpot(spotId);
  showTab('wave');
}

function showTab(tab) {
  document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.htab').forEach(el => el.classList.remove('active'));
  document.getElementById('pane-'+tab).classList.add('active');
  const idx = ['list','wave','tide','weather'].indexOf(tab);
  document.querySelectorAll('.htab')[idx].classList.add('active');
  if (tab==='list')    renderSpotList();
  if (tab==='tide') {
    requestAnimationFrame(() => { if(DATA) drawTideChart(new Date()); });
    if(DATA) renderForecast();
  }
  if (tab==='weather') renderWeather();
}

loadAll();
renderSpotList();
